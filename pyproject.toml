[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-data-pipeline"
version = "0.2.0"
description = "Pipeline reutilizável para descoberta e coleta de canais, vídeos, transcrições e comentários do YouTube."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Cortex / projeto de coleta YouTube"}]
dependencies = [
  "google-api-python-client>=2.150",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "youtube-transcript-api>=1.2",
  "yt-dlp>=2025.1.0",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
youtube-pipeline = "youtube_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
